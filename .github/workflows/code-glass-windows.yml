name: Code Glass Windows Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    name: Test and build Windows portable EXE
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run complete test suite
        run: npm test
      - name: Check repository hygiene
        shell: pwsh
        run: |
          git diff --check
          $unsafe = @(git ls-files | Select-String -Pattern '(^|/)(\.env|\.env\..*)$|\.(pem|key|p12|pfx)$|(^|/)node_modules/')
          if ($unsafe.Count -gt 0) { throw 'Unsafe tracked file detected.' }
      - name: Build Windows portable EXE
        working-directory: electron
        run: npx --yes electron-builder --win portable --publish never
      - name: Write build metadata
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path electron\\dist -Force | Out-Null
          "Code Glass Windows portable build" | Set-Content electron\\dist\\BUILD-METADATA.txt
          "Commit: $env:GITHUB_SHA" | Add-Content electron\\dist\\BUILD-METADATA.txt
          "Ref: $env:GITHUB_REF_NAME" | Add-Content electron\\dist\\BUILD-METADATA.txt
      - name: Upload Windows EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeGlass-Windows-${{ github.sha }}
          path: |
            electron/dist/*.exe
            electron/dist/BUILD-METADATA.txt
          if-no-files-found: error
          retention-days: 30
